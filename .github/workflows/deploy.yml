name: Java CI/CD Pipeline

on:
  push:
    branches:
      - master  # Runs on push to the master branch
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
        

      - name: Grant Execute Permissions for Maven Wrapper
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3.1.2  # ✅ Stable version
        with:
          name: java-app
          path: target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v3.0.2  # ✅ Stable version
        with:
          name: java-app
          path: target

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/app  # Ensure correct deployment directory
            rm -f app.jar
            mv ~/target/*.jar app.jar
            nohup java -jar app.jar > app.log 2>&1 &
